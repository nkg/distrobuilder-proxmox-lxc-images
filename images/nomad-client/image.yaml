---
# nomad-client — service-base + Nomad agent + podman task driver.
#
# Drop-in template for Nomad worker nodes in the
# nkg/terraform-proxmox-fleet platform. The LXC runs the Nomad agent
# in client mode, and Nomad spawns podman containers for the actual
# CI runner jobs.
#
# Why a separate image instead of just installing Nomad on top of
# service-base via cloud-init runcmd? Two reasons:
#   1. Bake-time install is reproducible — every LXC clones from the
#      same versioned binary; cloud-init install can race apt repos
#      and pin to whatever's "latest" at boot time.
#   2. Nomad clients are the hot path in this platform (every CI job
#      lands here). Cold-boot delay matters; pre-baked saves ~30s per
#      LXC instantiation.
#
# Both the Nomad version and the podman task driver version are
# pinned in `actions:`, each with a checksum. Bumping either is a
# deliberate change (`feat: bump nomad to X.Y.Z`).
#
# The podman driver is a separate plugin — the Nomad binary does not
# bundle it. It's baked in here because every job this platform runs
# uses `driver = "podman"`, and a client without it comes up looking
# healthy while placing nothing.

image:
  description: "Debian {{ image.release }} + podman + Nomad client + podman driver (nkg)"
  distribution: debian
  release: trixie
  architecture: amd64
  expiry: 30d
  variant: default
  name: nkg-nomad-client-{{ image.release }}-{{ image.architecture }}

source:
  downloader: debootstrap
  url: http://deb.debian.org/debian
  keyserver: keyserver.ubuntu.com
  same_as: gutsy

targets:
  lxc:
    create_message: |-
      Welcome to {{ image.description }}
      Nomad binary is at /usr/local/bin/nomad; the podman task driver
      is at /var/lib/nomad/plugins/. The nomad.service systemd unit is
      installed but NOT enabled — drop a config at
      /etc/nomad.d/nomad.hcl and run `systemctl enable --now nomad`.
      Paths come from /etc/nomad.d/00-base.hcl; leave it in place.
    config:
      - type: all
        before: 5
        content: |-
          lxc.include = LXC_TEMPLATE_CONFIG/debian.common.conf
      - type: user
        before: 5
        content: |-
          lxc.include = LXC_TEMPLATE_CONFIG/debian.userns.conf
      - type: all
        after: 4
        content: |-
          lxc.include = LXC_TEMPLATE_CONFIG/common.conf
      - type: user
        after: 4
        content: |-
          lxc.include = LXC_TEMPLATE_CONFIG/userns.conf
      - type: all
        content: |-
          lxc.arch = x86_64

files:
  - path: /etc/hostname
    generator: hostname

  - path: /etc/hosts
    generator: hosts

  - path: /etc/machine-id
    generator: remove

  - path: /etc/resolv.conf
    generator: remove

  - path: /etc/systemd/network/eth0.network
    generator: dump
    content: |-
      [Match]
      Name=eth0

      [Network]
      DHCP=yes

  - path: /etc/ssh/sshd_config.d/10-nkg.conf
    generator: dump
    content: |-
      PasswordAuthentication no
      PermitRootLogin prohibit-password
      ChallengeResponseAuthentication no
      UsePAM yes
      X11Forwarding no
      PrintMotd no

  # Nomad systemd unit. Upstream's official unit (slightly tweaked
  # for our binary location and to default to client mode).
  - path: /etc/systemd/system/nomad.service
    generator: dump
    content: |-
      [Unit]
      Description=Nomad
      Documentation=https://www.nomadproject.io/docs/
      Wants=network-online.target
      After=network-online.target

      # Drop-in to wait for podman socket if you wire Nomad's podman
      # driver — service-base sets up podman.socket, but Nomad doesn't
      # strictly need it before starting.

      [Service]
      Type=notify
      EnvironmentFile=-/etc/nomad.d/nomad.env
      User=nomad
      Group=nomad
      ExecReload=/bin/kill -HUP $MAINPID
      ExecStart=/usr/local/bin/nomad agent -config /etc/nomad.d
      KillMode=process
      KillSignal=SIGINT
      LimitNOFILE=65536
      LimitNPROC=infinity
      Restart=on-failure
      RestartSec=2

      ## Configure unit start rate limiting. Failsafe.
      StartLimitBurst=3
      StartLimitIntervalSec=10

      TasksMax=infinity
      OOMScoreAdjust=-1000

      [Install]
      WantedBy=multi-user.target

  # Base config fragment. Nomad reads and merges every *.hcl in
  # /etc/nomad.d, so the operator's nomad.hcl layers client/server
  # config on top of this without restating the paths.
  #
  # plugin_dir is set explicitly rather than leaning on its
  # <data_dir>/plugins default, so the podman driver installed below is
  # still found if the operator points data_dir elsewhere. Getting this
  # wrong is quiet: the client simply comes up advertising no podman
  # driver, and every job the dispatcher submits sits unplaced.
  - path: /etc/nomad.d/00-base.hcl
    generator: dump
    content: |-
      data_dir   = "/var/lib/nomad"
      plugin_dir = "/var/lib/nomad/plugins"

packages:
  manager: apt
  update: true
  cleanup: true
  sets:
    - packages:
        # System base — same set as service-base.
        - systemd
        - systemd-sysv
        - ca-certificates
        - cloud-init
        - cloud-initramfs-growroot
        - sudo
        - openssh-server
        - tzdata
        - locales

        # Operator basics.
        - curl
        - jq
        - git
        - vim-tiny
        - less
        - htop

        # Container runtime — podman, used by Nomad's podman driver
        # at runtime to spawn CI runner workloads.
        - podman
        - buildah
        - skopeo
        - fuse-overlayfs
        - uidmap
        - slirp4netns

        # Nomad install needs `unzip` to unpack the release tarball;
        # `getent` is in base but we explicitly list `passwd` /
        # `adduser` for the nomad user creation in actions below.
        - unzip
        - adduser
      action: install

actions:
  - trigger: post-packages
    action: |-
      #!/bin/sh -eux

      # ---- systemd / podman setup (mirrors service-base) ----

      systemctl enable systemd-networkd

      mkdir -p /etc/containers
      cat > /etc/containers/storage.conf <<'EOF'
      [storage]
      driver = "overlay"
      runroot = "/run/containers/storage"
      graphroot = "/var/lib/containers/storage"

      [storage.options]
      mount_program = "/usr/bin/fuse-overlayfs"
      EOF

      cat > /etc/containers/registries.conf <<'EOF'
      unqualified-search-registries = ["docker.io", "quay.io"]
      short-name-mode = "permissive"
      EOF

      systemctl enable podman.socket

      echo 'en_US.UTF-8 UTF-8' > /etc/locale.gen
      locale-gen
      update-locale LANG=en_US.UTF-8
      ln -sf /usr/share/zoneinfo/UTC /etc/localtime

      # ---- Nomad install ----

      # Pinned versions. Bumping either is a deliberate change.
      #
      # On the 2.x line. Nomad requires servers to be upgraded before
      # clients and does not support skipping minor versions, so once
      # a fleet exists this must stay compatible with its servers —
      # see "Upgrading Nomad" in the repo README before moving it.
      NOMAD_VERSION=2.0.5

      # The podman task driver is a SEPARATE plugin — the Nomad binary
      # does not bundle it. Without it a client advertises no podman
      # driver and every `driver = "podman"` job (i.e. everything
      # gha-nomad-dispatcher submits) sits unplaced with a
      # "missing drivers" constraint failure.
      NOMAD_PODMAN_VERSION=0.6.5

      # SHA256s of the linux_amd64 zips, from the SHA256SUMS published
      # alongside each release:
      #   https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_SHA256SUMS
      #   https://releases.hashicorp.com/nomad-driver-podman/${NOMAD_PODMAN_VERSION}/nomad-driver-podman_${NOMAD_PODMAN_VERSION}_SHA256SUMS
      # Refresh these whenever the versions above change.
      NOMAD_SHA256=6425e43967bb0b2b4979b0d06da9b06772848b658dae372f1256d51ddcfe53c3
      NOMAD_PODMAN_SHA256=786b04ee9d002e6b4231dbcb8dde3ab65c6fe0a728a01fcad14e87a681e48ce1

      # Dedicated unprivileged user matching upstream's recommendation.
      adduser --system --group --no-create-home --home /var/lib/nomad nomad
      install -d -o nomad -g nomad -m 0700 /var/lib/nomad
      install -d -o root  -g root  -m 0755 /etc/nomad.d

      # Matches plugin_dir in /etc/nomad.d/00-base.hcl, so the driver
      # dropped here is found without extra operator configuration.
      install -d -o nomad -g nomad -m 0755 /var/lib/nomad/plugins

      # Fetch + install binaries. Use the official HashiCorp releases.
      # Both are verified against their published checksums — an
      # unexpected hash aborts the build rather than baking unknown
      # bits into the template every CI runner in the fleet boots from.
      curl -fsSL -o /tmp/nomad.zip \
        "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_linux_amd64.zip"
      echo "${NOMAD_SHA256}  /tmp/nomad.zip" > /tmp/nomad.zip.sha256
      sha256sum -c /tmp/nomad.zip.sha256
      rm -f /tmp/nomad.zip.sha256
      unzip -o /tmp/nomad.zip -d /usr/local/bin/
      chmod 0755 /usr/local/bin/nomad
      rm -f /tmp/nomad.zip

      curl -fsSL -o /tmp/nomad-driver-podman.zip \
        "https://releases.hashicorp.com/nomad-driver-podman/${NOMAD_PODMAN_VERSION}/nomad-driver-podman_${NOMAD_PODMAN_VERSION}_linux_amd64.zip"
      echo "${NOMAD_PODMAN_SHA256}  /tmp/nomad-driver-podman.zip" > /tmp/nomad-driver-podman.zip.sha256
      sha256sum -c /tmp/nomad-driver-podman.zip.sha256
      rm -f /tmp/nomad-driver-podman.zip.sha256
      # Extract ONLY the driver binary. The zip also ships LICENSE.txt,
      # and Nomad tries to load every file in plugin_dir as a plugin —
      # a stray text file there is a startup error, not an ignored file.
      unzip -o -j /tmp/nomad-driver-podman.zip nomad-driver-podman \
        -d /var/lib/nomad/plugins/
      chown nomad:nomad /var/lib/nomad/plugins/nomad-driver-podman
      chmod 0755 /var/lib/nomad/plugins/nomad-driver-podman
      rm -f /tmp/nomad-driver-podman.zip

      # Sanity: both binaries run and report the versions we pinned.
      /usr/local/bin/nomad version | grep -q "v${NOMAD_VERSION}"
      test -x /var/lib/nomad/plugins/nomad-driver-podman

      # Service is installed but NOT enabled. Operator drops a config
      # at /etc/nomad.d/nomad.hcl and runs `systemctl enable --now
      # nomad` from cloud-init / Ansible.
      systemctl daemon-reload || true

  - trigger: post-files
    action: |-
      #!/bin/sh -eux

      # Lock root (cloud-init lays in SSH keys per instance).
      passwd -l root
