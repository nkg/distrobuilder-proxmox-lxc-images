name: Release

# Tag-driven release flow. Push a `v<x>.<y>.<z>` tag → this builds
# every image fresh and attaches the tarballs to a GitHub Release.
#
# Consumers download stable artefacts straight from the release page
# instead of relying on 14-day workflow-artifact retention.
#
# Example tag: `v0.2.0`
#
# Assets land at:
#   https://github.com/nkg/distrobuilder-proxmox-lxc-images/releases/download/v0.2.0/service-base.tar.xz
#   https://github.com/nkg/distrobuilder-proxmox-lxc-images/releases/download/v0.2.0/nomad-client.tar.xz

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to release (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write  # needed to create the release + upload assets
  # Keyless cosign signing exchanges the job's OIDC token for a
  # short-lived Fulcio certificate — no long-lived key to store.
  id-token: write
  # Lets actions/attest-build-provenance record SLSA provenance for
  # the tarballs.
  attestations: write

jobs:
  build:
    name: build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mirror CI's matrix. Keep these two in lockstep when adding
        # new recipes.
        image:
          - service-base
          - nomad-client
    steps:
      - uses: actions/checkout@v7

      - name: Install distrobuilder
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap
          sudo snap install distrobuilder --classic

      - name: Build ${{ matrix.image }}
        run: sudo ./scripts/build-image.sh ${{ matrix.image }}

      - name: Stage tarball for release
        # Rename to a stable filename — no SHA suffix — so the
        # download URL is predictable for operators.
        run: |
          mkdir -p staging
          cp output/${{ matrix.image }}/${{ matrix.image }}.tar.xz staging/

      - name: Upload tarball as workflow artifact (intermediate)
        # The release-create job downloads these and attaches them to
        # the release in one shot. Per-job upload here keeps the
        # build/release split clean.
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.image }}
          path: staging/${{ matrix.image }}.tar.xz
          retention-days: 1
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all built tarballs
        uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Resolve tag name
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      # Checksums let an operator verify a downloaded tarball without
      # any tooling beyond sha256sum, and give cosign a single small
      # file to sign that covers both images.
      - name: Generate SHA256SUMS
        working-directory: assets
        run: |
          set -euo pipefail
          sha256sum service-base.tar.xz nomad-client.tar.xz > SHA256SUMS
          cat SHA256SUMS

      # SBOM: the LXC rootfs is a Debian install, so the meaningful
      # bill of materials is its package set. Syft reads the dpkg
      # database straight out of the tarball.
      - name: Generate SBOM per image
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin
          for img in service-base nomad-client; do
            syft "file:assets/${img}.tar.xz" \
              -o spdx-json="assets/${img}.spdx.json"
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      # Sign the checksum file rather than each tarball: verifying
      # SHA256SUMS then checking hashes covers every asset, and keeps
      # one signature to check instead of one per file.
      - name: Sign SHA256SUMS (keyless)
        working-directory: assets
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS

      - name: Attest build provenance for the tarballs
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            assets/service-base.tar.xz
            assets/nomad-client.tar.xz

      - name: Create release + upload assets
        # softprops/action-gh-release wraps the API call neatly:
        # creates the release with auto-generated notes from PRs
        # merged since the previous tag, then uploads everything
        # under `files:` as assets.
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            assets/service-base.tar.xz
            assets/nomad-client.tar.xz
            assets/service-base.spdx.json
            assets/nomad-client.spdx.json
            assets/SHA256SUMS
            assets/SHA256SUMS.sig
            assets/SHA256SUMS.pem
          fail_on_unmatched_files: true
