name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # yamllint (over .github/ + images/) moved to lint-workflows.yml, which
  # installs yamllint via uv. The old inline job used `mise install`, whose
  # pipx backend broke on mise 2026.6.10 (passes pip an `--uploaded-prior-to`
  # flag older pip rejects). build no longer gates on it; lint runs in parallel.

  # ─── Build: actually run distrobuilder against each recipe ─────────

  build:
    name: build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Discover images at workflow-author time. New recipes need a
        # matrix entry — keeps surprises out of CI.
        image:
          - service-base
          - nomad-client
    steps:
      - uses: actions/checkout@v7

      - name: Install distrobuilder
        # distrobuilder was removed from Ubuntu's apt archives (it
        # lives only in upstream's snap channel now — Canonical's
        # canonical distribution path, pun intended). Snap is
        # pre-installed on ubuntu-latest runners, so this is a single
        # `snap install` step. Adds ~30s vs an apt install but the
        # alternative (build from source via Go) is slower and noisier.
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap
          sudo snap install distrobuilder --classic

      - name: Build ${{ matrix.image }}
        run: sudo ./scripts/build-image.sh ${{ matrix.image }}

      - name: Attach tarball as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.image }}-${{ github.sha }}
          path: output/${{ matrix.image }}/${{ matrix.image }}.tar.xz
          retention-days: 14
          if-no-files-found: error

  # ─── PR hygiene ───────────────────────────────────────────────────

  pr-title:
    name: PR title is conventional
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            ci
            docs
            test
            refactor
            perf
          requireScope: false
